name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The floor, pinned exactly. `npm run check` below is the last gate
          # before publish, so running it on the oldest supported runtime is the
          # strongest available check that `engines.node` is not aspirational.
          node-version: 22.13.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      # Provenance needs a public repo plus OIDC, which is why it lives here
      # rather than in publishConfig — putting it there would break any local
      # `npm publish`.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
