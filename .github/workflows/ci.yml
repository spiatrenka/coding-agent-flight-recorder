name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.13.0 is the engines floor. node:sqlite landed in 22.5 behind
        # --experimental-sqlite, a flag a bin script cannot set for its own
        # process — but it was unflagged in 23.4.0 and backported to the 22 LTS
        # line in 22.13.0. That is the oldest version running this tool as a
        # plain CLI; below it you get ERR_UNKNOWN_BUILTIN_MODULE at import.
        #
        # The floor leg is pinned to an EXACT version, never "22.x". setup-node
        # resolves a .x spec to the newest matching release, so the previous
        # "24.x" leg tested whatever 24 shipped last week and never once tested
        # >=24.0.0. A floating spec cannot keep `engines` honest. When
        # engines.node moves, move this literal with it.
        node: ["22.13.0", "24.x", "26.x"]
        include:
          - os: macos-latest
            node: "22.13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:fast

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      # Coverage thresholds landed in 22.8, which the 22.13 floor now clears —
      # so the original reason for isolating this job is gone. It stays a single
      # leg because the matrix above already covers versions and running the
      # thresholds three times proves nothing extra.
      - run: npm run coverage
      - run: npm run coverage:lcov
        if: always()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run lint
