name: Wrong verdict or misfiring detector
description: A run was graded wrongly, or a detector fired when it should not have (or didn't when it should).
labels: [detector-accuracy]
body:
  - type: markdown
    attributes:
      value: |
        This is the most valuable kind of report this project receives.

        Detector thresholds can only be validated against real usage, and that
        is exactly the data the maintainers cannot generate for themselves. Every
        threshold in this tool was set against one person's session history, so
        the ones that are wrong are most likely wrong in the direction of that
        person's habits.

        **Run `flightrec feedback <run-id>` and paste the output below.** It is
        built for this: no prompts, paths, file contents, commands or timestamps
        are in it, so you do not have to redact it by hand. Do not paste
        `flightrec report --json` — that is the full record, including your
        prompts and file contents.

  - type: dropdown
    id: given
    attributes:
      label: Verdict it gave
      options: [productive, unchanged, questionable, wasteful, risky]
    validations:
      required: true

  - type: dropdown
    id: expected
    attributes:
      label: Verdict you expected
      options: [productive, unchanged, questionable, wasteful, risky]
    validations:
      required: true

  - type: textarea
    id: fired
    attributes:
      label: The run summary
      description: >
        Paste the whole output of `flightrec feedback <run-id>`. If you would
        rather not, the detector names alone are still useful — e.g.
        `loop.churn`, `risk.blast_radius`.
      render: text
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What about this run makes that grade wrong
      description: >
        Describe the run in your own words rather than pasting it. What did you
        ask for, roughly what did the agent do, and why is the grade unfair?
    validations:
      required: true

  - type: checkboxes
    id: no-real-data
    attributes:
      label: Data check
      options:
        - label: I have redacted anything private from the details above.
          required: true
